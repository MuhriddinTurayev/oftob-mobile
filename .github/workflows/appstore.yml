name: App Store Connect'ga yuklash (TestFlight)

# Imzolangan ilovani yig'ib, App Store Connect'ga (TestFlight) yuboradi. Mac kerak emas — GitHub'ning macOS serverida ishlaydi.
# Ishga tushirish: GitHub -> Actions -> "App Store Connect'ga yuklash" -> Run workflow.
# Oldindan sozlash (bir marta): APPSTORE_README.md, 3-bo'lim. Kerakli Secrets/Variables o'sha yerda.
#
# Eslatma: bu workflow Apple hisobisiz sinab ko'rilmagan — birinchi ishga tushirishda log'ni tekshiring.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build raqami (har yuklashda oldingisidan KATTA bo'lishi shart). Bo'sh qolsa — pubspec.yaml dagi (+N)."
        required: false
        default: ''

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Sozlamalarni tekshirish
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret yo'q: $v (APPSTORE_README.md, 3-bo'lim)"; exit 1; fi
          done
          if [ -z "$BUNDLE_ID" ]; then echo "BUNDLE_ID=uz.oftob.oftobMobile" >> "$GITHUB_ENV"; fi
          if [ -z "${{ secrets.APPSTORE_PRIVATE_KEY }}" ]; then echo "::error::Secret yo'q: APPSTORE_PRIVATE_KEY"; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: App Store Connect API kalitini tayyorlash
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Flutter yig'ish (Xcode uchun tayyorlash)
        run: |
          ARGS="--release --no-codesign --dart-define=BUILD_SHA=${{ github.sha }}"
          if [ -n "${{ inputs.build_number }}" ]; then ARGS="$ARGS --build-number=${{ inputs.build_number }}"; fi
          flutter build ios $ARGS

      - name: Archive (Apple bulutida avtomatik imzo)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Export va App Store Connect'ga yuklash
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Kalitni o'chirish
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
